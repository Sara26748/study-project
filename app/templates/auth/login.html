{% extends "base.html" %} {% block title %}{{ _('Anmelden') }}{% endblock %} {% block content
%}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <h2 class="text-center mb-4">{{ _('Anmelden') }}</h2>
      <form method="POST">
        <div class="mb-3">
          <label for="email" class="form-label">{{ _('E-Mail') }}</label>
          <input
            type="email"
            class="form-control"
            id="email"
            name="email"
            required
          />
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">{{ _('Passwort') }}</label>
          <input
            type="password"
            class="form-control"
            id="password"
            name="password"
            required
          />
        </div>
        <button type="submit" class="btn btn-primary w-100">{{ _('Anmelden') }}</button>
      </form>
      <div class="text-center mt-3">
        <a href="{{ url_for('auth.register') }}"
          >{{ _('Noch kein Konto? Registrieren') }}</a
        >
      </div>
    </div>
  </div>
</div>
{% endblock %}
